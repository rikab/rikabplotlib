[build-system]
requires = [
    "hatchling>=1.13.0",
    "hatch-vcs>=0.3.0",
]
build-backend = "hatchling.build"

[project]
name = "rikabplotlib"
dynamic = ["version"]
description = "Plotting Library for Rikab"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [
    { name = "Rikab Gambhir", email = "rikab@mit.edu" },
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
# 3.7 is where plt.style.use accepts package-qualified sheet names
dependencies = [
    "matplotlib>=3.7.0",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/rikab/rikabplotlib"
Repository = "https://github.com/rikab/rikabplotlib"
Issues = "https://github.com/rikab/rikabplotlib/issues"





[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/rikabplotlib/_version.py"

[tool.hatch.build.targets.sdist]
# only-include files that are needed to ignore examples
only-include = [
    "/src",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rikabplotlib"]

[tool.coverage.run]
source = ["rikabplotlib"]
branch = true

[tool.coverage.report]
precision = 1
sort = "cover"
show_missing = true